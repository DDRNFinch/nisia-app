<script>/* Phone view or desktop view on a computer: the app across the screen, or exactly as on a phone in a phone frame
   (../phone.html), remembered for this app. Phones and tablets just show the app. */
(function(){var A="paros",D="phone";try{
 var q=location.search;
 if(window.top!==window||/[?&]inframe=1/.test(q)){document.documentElement.classList.add("in-phone-frame");return}
 if(navigator.webdriver&&!/[?&]view=/.test(q))return;
 var wide=function(){return innerWidth>=900&&matchMedia("(hover:hover) and (pointer:fine)").matches};
 var m=/[?&]view=(phone|desktop)/.exec(q);if(m)localStorage.setItem("view-"+A,m[1]);
 var go=function(){var s=location.search.replace(/([?&])view=\w+&?/,"$1").replace(/[?&]$/,"");location.replace("../phone.html?app="+A+"&u="+encodeURIComponent(location.pathname+s+location.hash))};
 if(wide()&&(localStorage.getItem("view-"+A)||D)==="phone"){go();return}
 addEventListener("DOMContentLoaded",function(){if(!wide())return;var b=document.createElement("button");b.type="button";b.id="phone-view";b.textContent="\ud83d\udcf1 Phone view";b.title="Show the app as it is on a phone";
  b.style.cssText="position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:2147483000;font:700 13px/1 system-ui,-apple-system,Segoe UI,sans-serif;padding:10px 13px;border-radius:999px;border:1.5px solid rgba(23,32,51,.18);background:#fff;color:#172033;box-shadow:0 6px 18px rgba(23,32,51,.12);cursor:pointer";
  b.onclick=function(){try{localStorage.setItem("view-"+A,"phone")}catch(e){}go()};document.body.appendChild(b)});
}catch(e){}})();</script>

<script>
/* The offline copy (sw.js): Paros opens without signal from the last download. */
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").then((reg) => {
  const offer = (w) => { if (!w || !navigator.serviceWorker.controller || document.getElementById("upd")) return;
    const b = document.createElement("div"); b.id = "upd"; b.className = "update-bar"; b.setAttribute("role", "status");
    b.innerHTML = '<span>A new version of Paros is ready.</span><button class="btn primary">Update</button>';
    b.querySelector("button").onclick = () => { b.querySelector("button").disabled = true; w.postMessage("update"); };
    document.body.appendChild(b); };
  if (reg.waiting) offer(reg.waiting);
  reg.addEventListener("updatefound", () => { const w = reg.installing; w.addEventListener("statechange", () => { if (w.state === "installed") offer(w); }); });
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (reloading || !document.getElementById("upd")) return; reloading = true; location.reload(); });
}).catch(() => {}));
</script>
