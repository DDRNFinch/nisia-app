<title>Symi has moved</title>
<script>
/* Symi moved to symi-app/ (a phone that once had an old Symi installed can keep a broken record of it at this address,
   which stops Chrome installing it again). Anything opened here goes straight on, keeping the rest of the address. */

</script>
