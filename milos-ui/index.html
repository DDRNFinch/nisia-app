   (../phone.html), remembered for this app. Phones and tablets just show the app. */

 var q=location.search;
 if(window.top!==window||/[?&]inframe=1/.test(q)){document.documentElement.classList.add("in-phone-frame");return}
 if(navigator.webdriver&&!/[?&]view=/.test(q))return;
 var wide=function(){return innerWidth>=900&&matchMedia("(hover:hover) and (pointer:fine)").matches};
 var m=/[?&]view=(phone|desktop)/.exec(q);if(m)localStorage.setItem("view-"+A,m[1]);
 var go=function(){var s=location.search.replace(/([?&])view=\w+&?/,"$1").replace(/[?&]$/,"");location.replace("../phone.html?app="+A+"&u="+encodeURIComponent(location.pathname+s+location.hash))};
 if(wide()&&(localStorage.getItem("view-"+A)||D)==="phone"){go();return}
 addEventListener("DOMContentLoaded",function(){if(!wide())return;var b=document.createElement("button");b.type="button";b.id="phone-view";b.textContent="\ud83d\udcf1 Phone view";b.title="Show the app as it is on a phone";

<div id="app"><div class="auth"><p class="muted" id="booting">Loading Milos…</p></div></div>
<script>
/* A backstop: if Milos hasn’t opened in 20 seconds, say why, and offer a reload or a fresh copy of the app. */
(function () {
  var errs = [];
  addEventListener("error", function (e) { errs.push((e.message || (e.target && (e.target.src || e.target.href)) || "error") + ""); }, true);
  addEventListener("unhandledrejection", function (e) { errs.push(String(e.reason && e.reason.message || e.reason)); });
  setTimeout(function () {
    var b = document.getElementById("booting"); if (!b) return;
    b.parentNode.innerHTML = '<div class="box"><h2>Milos is taking too long to open</h2><p class="muted">' + (navigator.onLine ? "It may be a slow connection, or an old copy of Milos on this phone." : "You’re offline.") + '</p>' +
      (errs.length ? '<p class="small muted">' + errs.slice(-3).join("<br>").replace(/[<>&]/g, "") + '</p>' : "") +
      '<button class="btn primary wide" id="bootReload">Reload</button><button class="btn ghost wide" id="bootReset">Reset Milos</button>' +
      '<p class="small muted">Reset gets a fresh copy of the app. Your learners and anything waiting to send stay on the phone.</p></div>';
    document.getElementById("bootReload").onclick = function () { location.reload(); };
    document.getElementById("bootReset").onclick = function () {
      var jobs = [];
      if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
      if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return /^milos-/.test(k); }).map(function (k) { return caches.delete(k); })); }));
      Promise.all(jobs).catch(function () {}).then(function () { location.replace(location.pathname + "?fresh=" + Date.now()); });
    };
  }, 20000);
})();
</script>

<script>
/* The offline copy (sw.js). When a new version of Milos has downloaded, a bar offers to switch to it. */
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").then((reg) => {
  const offer = (w) => { if (!w || !navigator.serviceWorker.controller || document.getElementById("upd")) return;
    const b = document.createElement("div"); b.id = "upd"; b.className = "update-bar"; b.setAttribute("role", "status");
    b.innerHTML = '<span>A new version of Milos is ready.</span><button class="btn primary">Update</button>';
    b.querySelector("button").onclick = () => { b.querySelector("button").disabled = true; w.postMessage("update"); };
    document.body.appendChild(b); };
  if (reg.waiting) offer(reg.waiting);
  reg.addEventListener("updatefound", () => { const w = reg.installing; w.addEventListener("statechange", () => { if (w.state === "installed") offer(w); }); });
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (reloading || !document.getElementById("upd")) return; reloading = true; location.reload(); });
  setInterval(() => reg.update().catch(() => {}), 30 * 60000);
}).catch(() => {}));
</script>
